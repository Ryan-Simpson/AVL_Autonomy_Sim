# Full-lap sim waypoints for igvc_course.sdf, in Paarseus/IGVC_ROS2 waypoints.yaml format so
# his mission_manager reads them unchanged (sent in order, next goal sent at 2.0 m).
#
# Picked 2026-11-09 (Ryan: "i want it to do a full lap"). Counterclockwise from the spawn
# (map 0, 0.1, facing east): south lane -> east side (through the barrel slalom) -> north
# lane (over the ramp at map 0, 29.3) -> west side -> back along the south lane to 3 m behind
# the spawn. About 147 m.
# Method (v2, after run 1 stuck at the south-east bend): clearance = min(distance to painted
# line [ground.png at world 0, 16.3], barrel centre - 0.3 m [model.sdf poses]). Grid Dijkstra
# (0.2 m), cost 1 + 8/clearance^2, centre cells under 0.8 m blocked; Parsa's nav2 footprint
# rectangle (front 0.8128, rear 0.2794, half-width 0.415) swept along the route stays >= 0.30 m
# off every line. Waypoints every ~3 m (>= 2.4 m apart, so the 2.0 m switch never skips one),
# then nudged up to 1 m so the corner-cut segments mission_manager really commands (it aims at
# the next waypoint from 2 m before the current one) stay clear of lines where possible.
# Every waypoint >= 0.81 m from any line or barrel edge.
# Ramp caveat: the waypoints near y 29.3 sit on the ramp (0.3 m peak, 8.5 deg). Not yet
# tested: the LiDAR height band may mark it as an obstacle, and climbing is unproven.
# Map = world because the world origin is the navsat datum. lat/lon from navsat_transform's
# /toLL with config/igvc/navsat.yaml, so /fromLL round-trips them. Map (x, y) per comment.

