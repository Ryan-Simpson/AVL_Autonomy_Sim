# Fortress ros_gz_bridge mappings for the drive loop.
# Loaded only by parameter_bridge via config_file.
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/model/tracked_rover/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "ignition.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/wheel_odom"
  gz_topic_name: "/model/tracked_rover/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "ignition.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "ignition.msgs.Clock"
  direction: GZ_TO_ROS

# No /tf from diff-drive: Parsa's odom EKF (sim.launch.py) is the only odom -> base_link
# publisher (AGENTS.md, Ryan 2026-11-09).

# VLP-16: gpu_lidar on the velodyne link publishes its cloud on <topic>/points.
- ros_topic_name: "/velodyne_points"
  gz_topic_name: "/velodyne/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "ignition.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# ZED X sim cameras (rgbd_camera). ROS names follow avros_perception (zed_wrapper v5.x).
